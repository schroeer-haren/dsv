# Dependabot: keeps dependencies and GitHub Actions up to date.
#
# Grouped instead of one PR per package: per ecosystem at most three PRs,
# minor/patch, major and security, each as one PR.
version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '05:00'
      timezone: 'Europe/Berlin'
    open-pull-requests-limit: 5
    ignore:
      # Development and CI run on Node 26 (Active LTS, `.nvmrc`); the types
      # follow that runtime, not the newest Node release. Minor and patch
      # within 26.x keep coming.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      npm-minor-patch:
        applies-to: version-updates
        update-types: ['minor', 'patch']
      npm-major:
        applies-to: version-updates
        update-types: ['major']
      npm-security:
        applies-to: security-updates
        patterns: ['*']
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '05:00'
      timezone: 'Europe/Berlin'
    open-pull-requests-limit: 5
    groups:
      github_actions-minor-patch:
        applies-to: version-updates
        update-types: ['minor', 'patch']
      github_actions-major:
        applies-to: version-updates
        update-types: ['major']
      github_actions-security:
        applies-to: security-updates
        patterns: ['*']
